apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: {{ .Values.certManagerNamespace }}
type: Opaque
stringData:
  api-token: {{ .Values.cloudflareApiToken | quote }}
---
# Our own zone, over DNS-01 because a wildcard cannot be solved over HTTP.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.acmeEmail | quote }}
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
# Tenant-owned zones, which we hold no credentials for. There is deliberately no
# staging twin: a staging certificate chains to a root nothing trusts, and from
# step_vta_register_dids on the components resolve each other's did:webvh over
# HTTPS and reject an untrusted chain.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.acmeEmail | quote }}
    privateKeySecretRef:
      name: letsencrypt-http01
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingressClass }}
