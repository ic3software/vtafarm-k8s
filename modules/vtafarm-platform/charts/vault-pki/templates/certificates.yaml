apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.name }}-selfsigned
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.name }}-ca
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: {{ .Values.caCommonName }}
  secretName: {{ .Values.name }}-ca
  duration: {{ .Values.caDuration }}
  renewBefore: {{ .Values.caRenewBefore }}
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: {{ .Values.name }}-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.name }}-ca-issuer
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: {{ .Values.name }}-ca
---
# The secret this produces is mounted by the Vault pods, so it has to exist
# before they can start. They stay in ContainerCreating until it does.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.name }}-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.name }}-tls
  duration: {{ .Values.certDuration }}
  renewBefore: {{ .Values.certRenewBefore }}
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: {{ .Values.name }}-ca-issuer
    kind: Issuer
  commonName: {{ .Values.commonName }}
  ipAddresses:
{{ toYaml .Values.ipAddresses | indent 4 }}
  dnsNames:
{{ toYaml .Values.dnsNames | indent 4 }}
